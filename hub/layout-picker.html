<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Layout Picker — 50 Options</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#0a0f1a;color:#e8edf2;padding:2rem 1rem 4rem}
h1{font-size:1.2rem;font-weight:800;margin-bottom:.35rem}
p{font-size:.8rem;color:#8fa3b8;margin-bottom:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.thumb{cursor:pointer;border:2px solid #1f3349;border-radius:10px;overflow:hidden;transition:border-color .15s,transform .1s;background:#111}
.thumb:hover{border-color:#4a90d9;transform:translateY(-2px)}
.thumb.selected{border-color:#e96c5a;box-shadow:0 0 0 3px rgba(233,108,90,.25)}
.thumb-label{padding:.45rem .6rem;display:flex;justify-content:space-between;align-items:center}
.thumb-num{font-size:.75rem;font-weight:800;color:#e96c5a}
.thumb-name{font-size:.62rem;color:#6b8499;text-align:right;max-width:130px;line-height:1.3}
.thumb-canvas{height:115px;position:relative;overflow:hidden}
/* selection bar */
.selection-bar{position:fixed;bottom:0;left:0;right:0;background:#0d1b2a;border-top:1px solid #1f3349;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.selection-bar p{margin:0;font-size:.82rem;color:#8fa3b8}
.selection-bar strong{color:#e8edf2}
.confirm-btn{background:#e96c5a;color:#fff;border:none;border-radius:8px;padding:.5rem 1.4rem;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}
.confirm-btn:hover{background:#d45f4e}

/* ── Layout element base colors ── */
/* Dark palette */
.dh{background:#0f2033} /* dark header */
.dsb{background:#111f2e} /* dark sidebar */
.dc{background:#0d1b2a} /* dark content bg */
.dk{background:#162233} /* dark card */
.da{background:#e96c5a} /* dark accent */
.db{background:#1f3349} /* dark border/divider */
/* Light palette */
.lh{background:#e2e8f0}
.lsb{background:#f1f5f9}
.lc{background:#f8fafc}
.lk{background:#fff}
.la{background:#3b82f6}
.lb{background:#cbd5e1}
/* Mixed */
.mh{background:#1e3a5f}
.mc{background:#f0f4f8}

/* ── Shared layout atom styles ── */
.row{display:flex;height:100%}
.col{display:flex;flex-direction:column;height:100%}
.flex{display:flex}
.f1{flex:1}
.f2{flex:2}
.f3{flex:3}
.f4{flex:4}
.f5{flex:5}
.gap2{gap:2px}
.gap3{gap:3px}
.p2{padding:2px}
.p3{padding:3px}
.p4{padding:4px}
.r4{border-radius:4px}
.r2{border-radius:2px}
.h8{height:8px}
.h10{height:10px}
.h12{height:12px}
.h14{height:14px}
.h16{height:16px}
.h18{height:18px}
.h20{height:20px}
.h24{height:24px}
.h30{height:30px}
.h40{height:40px}
.h50{height:50px}
.h60{height:60px}
.h70{height:70px}
.h80{height:80px}
.w8{width:8px}
.w12{width:12px}
.w16{width:16px}
.w20{width:20px}
.w24{width:24px}
.w30{width:30px}
.w40{width:40px}
.w50{width:50px}
.w60{width:60px}
.wr{width:100%}
.mb2{margin-bottom:2px}
.mb3{margin-bottom:3px}
.mt2{margin-top:2px}
.circ{border-radius:50%}
.op5{opacity:.5}
.op3{opacity:.3}
.wrap{flex-wrap:wrap}
.center{align-items:center;justify-content:center}
</style>
</head>
<body>
<h1>Hub Layout Picker</h1>
<p>50 layouts drawn from real professional dashboards. Click to select, confirm at the bottom. Tell Glenn the number you want.</p>

<div class="grid" id="grid"></div>

<div class="selection-bar">
  <p>Selected: <strong id="sel-label">None</strong></p>
  <button class="confirm-btn" onclick="confirm()">Confirm selection →</button>
</div>

function rep(str, n){ return Array(n).fill(str).join(''); }

let selected = null;

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = layouts.map((l,i)=>`
    <div class="thumb" id="t${i}" onclick="select(${i})">
      <div class="thumb-canvas">${l.html}</div>
      <div class="thumb-label">
        <span class="thumb-num">#${i+1}</span>
        <span class="thumb-name">${l.name}</span>
      </div>
    </div>`).join('');
}

function select(i){
  if(selected !== null) document.getElementById('t'+selected).classList.remove('selected');
  selected = i;
  document.getElementById('t'+i).classList.add('selected');
  document.getElementById('t'+i).scrollIntoView({behavior:'smooth',block:'nearest'});
  document.getElementById('sel-label').textContent = `#${i+1} — ${layouts[i].name}`;
}

function confirm(){
  if(selected===null){alert('Pick a layout first.');return;}
  alert(`You picked #${selected+1}: ${layouts[selected].name}\n\nTell Glenn: "I want layout ${selected+1}" and he will build the full hub in that style.`);
}

renderGrid();
</script>
